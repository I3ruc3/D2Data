<section class="offline-database-page boss-page">
<header class="page-hero">
<p class="page-eyebrow">Diablo IV · Boss Timer</p>
<h1 class="offline-page-title">D4 Boss计时</h1>
<p class="page-lede">按固定周期推算下一次刷新，时间为本机时区。最后一分钟会高亮提醒。</p>
</header>
<div class="boss-cards">
<article class="boss-card normal">
<div class="boss-card-head"><h2 class="boss-card-title">巢穴首领</h2><span class="boss-interval" id="n-interval"></span></div>
<!-- role="timer" stays quiet per tick on purpose: aria-live here would announce every second. -->
<div class="boss-countdown-row" role="timer" aria-label="巢穴首领倒计时">
<div class="boss-digit-col"><span class="boss-time-number" id="n-m">00</span><span class="boss-time-unit">分</span></div>
<span class="boss-time-sep" aria-hidden="true">:</span>
<div class="boss-digit-col"><span class="boss-time-number" id="n-s">00</span><span class="boss-time-unit">秒</span></div>
</div>
<div class="boss-progress" aria-hidden="true"><i id="n-bar"></i></div>
<p class="boss-next"><span class="boss-label">下次刷新</span><span class="boss-spawn-time" id="n-spawn">计算中…</span></p>
</article>
<article class="boss-card world">
<div class="boss-card-head"><h2 class="boss-card-title">世界首领</h2><span class="boss-interval" id="w-interval"></span></div>
<div class="boss-countdown-row" role="timer" aria-label="世界首领倒计时">
<div class="boss-digit-col"><span class="boss-time-number" id="w-h">00</span><span class="boss-time-unit">时</span></div>
<span class="boss-time-sep" aria-hidden="true">:</span>
<div class="boss-digit-col"><span class="boss-time-number" id="w-m">00</span><span class="boss-time-unit">分</span></div>
<span class="boss-time-sep" aria-hidden="true">:</span>
<div class="boss-digit-col"><span class="boss-time-number" id="w-s">00</span><span class="boss-time-unit">秒</span></div>
</div>
<div class="boss-progress" aria-hidden="true"><i id="w-bar"></i></div>
<p class="boss-next"><span class="boss-label">下次刷新</span><span class="boss-spawn-time" id="w-spawn">计算中…</span></p>
</article>
</div>
<p class="boss-schedule-note">按预设周期推算，不读取游戏服务器状态。</p>
</section>
